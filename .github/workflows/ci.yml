name: CI - Pipeline de Integração Contínua

# Gatilhos: quando o workflow deve rodar
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:  # permite rodar manualmente pela aba Actions

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build-and-test:
    name: Build e Testes
    runs-on: ubuntu-latest

    steps:
      # Passo 1: baixa o código do repositório para o runner
      - name: Checkout do código
        uses: actions/checkout@v4

      # Passo 2: instala o Python na versão especificada
      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      # Passo 3: instala as dependências do projeto
      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest-html

      # Passo 4: verifica qualidade/estilo do código
      - name: Lint com flake8
        run: |
          flake8 src/ tests/ --max-line-length=
          
      - name: Executar testes
        run: python -m pytest test/ -v --html=report/index.html --self-contained-html

      # Passo 5: executa os testes automatizados com o PYTHONPATH configurado
      - name: Enviar relatorio
        uses: actions/upload-pages-artifact@v3
        with:
          path: report
    deploy:
      name: deploy
      needs: build-and-test
      if: github.ref == 'ref/heads/main'
      runs-on: ubuntu-latest
      environment:
        name: github-pages
        url: ${{ steps.deployment.outputs.pages_url}}
      steps:
        - name: publicar
          id: deployment
          uses: actions/deploy-pages@v4
        
